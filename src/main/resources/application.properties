spring.datasource.url=jdbc:postgresql://localhost:5432/payflow
spring.datasource.username=payflow
spring.datasource.password=payflow123
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
logging.level.org.springframework.security=DEBUG

spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.cache.type=redis

payflow.idempotency.ttl-seconds=86400
payflow.rate-limit.capacity=20
payflow.rate-limit.refill-seconds=60

resilience4j.retry.instances.paymentGateway.max-attempts=3
resilience4j.retry.instances.paymentGateway.wait-duration=500ms
resilience4j.retry.instances.paymentGateway.retry-exceptions=com.payflow.payflow.service.PaymentGatewayException

resilience4j.circuitbreaker.instances.paymentGateway.sliding-window-size=10
resilience4j.circuitbreaker.instances.paymentGateway.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.paymentGateway.failure-rate-threshold=5

resilience4j.ratelimiter.instances.orderCreation.limit-for-period=5
resilience4j.ratelimiter.instances.orderCreation.limit-refresh-period=1s
resilience4j.ratelimiter.instances.orderCreation.timeout-duration=0s
